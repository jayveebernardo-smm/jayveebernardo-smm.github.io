<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Faceted 3D arrow pointer in the site's purples. Tip (hotspot) at 3,3. -->
  <defs>
    <linearGradient id="lit" x1="3" y1="3" x2="27" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDE7FF"/>
      <stop offset="1" stop-color="#B9A2FB"/>
    </linearGradient>
    <linearGradient id="shade" x1="3" y1="3" x2="13" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A7BF2"/>
      <stop offset="1" stop-color="#6D3FD0"/>
    </linearGradient>
  </defs>
  <!-- soft shadow -->
  <path d="M5.5 6 L29.5 16.5 L18 18.5 L16 30 Z" fill="#1B0B3A" opacity=".28"/>
  <!-- extrusion (the thick edge under the arrow) -->
  <path d="M4.2 4.6 L28.4 15 L17 17 L14.6 28.6 Z" fill="#3E1C86"/>
  <!-- white rim so it reads on dark backgrounds too -->
  <path d="M3 3 L27 13.4 L15.6 15.6 L13.2 27 Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- lit facet -->
  <path d="M3 3 L27 13.4 L15.6 15.6 Z" fill="url(#lit)"/>
  <!-- shaded facet -->
  <path d="M3 3 L15.6 15.6 L13.2 27 Z" fill="url(#shade)"/>
  <!-- ridge highlight -->
  <path d="M3.6 3.6 L15.2 15.2" stroke="#FFFFFF" stroke-opacity=".7" stroke-width=".8" stroke-linecap="round"/>
</svg>
