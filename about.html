<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO. Live at https://jayveebernardo-smm.github.io/ (GitHub Pages). -->
    <title>Jayvee Bernardo - Social Media Manager</title>
    <meta name="description" content="Jayvee Bernardo is a Philippines-based social media manager. Content, community management and reporting for Facebook, Instagram, TikTok and LinkedIn." />
    <meta name="author" content="Jayvee Bernardo" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F5F9" />
    <link rel="canonical" href="https://jayveebernardo-smm.github.io/" />

    <!-- Tab icon: Jayvee's blob portrait (scripts/render/favicon-blob.mjs).
         Browsers cache tab icons hard: change ?v= whenever the icon changes
         (here and in public/work/*.html) or visitors keep the old one. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=blob" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=blob" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=blob" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/profile/jayvee-avatar.png" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share (Facebook, Messenger, LinkedIn previews). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jayvee Bernardo" />
    <meta property="og:title" content="Jayvee Bernardo - Social Media Manager" />
    <meta property="og:description" content="Content, community management and reporting for Facebook, Instagram, TikTok and LinkedIn." />
    <meta property="og:url" content="https://jayveebernardo-smm.github.io/" />
    <meta property="og:image" content="https://jayveebernardo-smm.github.io/profile/jayvee-avatar.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Jayvee Bernardo, social media manager" />
    <meta name="twitter:card" content="summary" />

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-hUlfNaNm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Co6H7rv2.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
